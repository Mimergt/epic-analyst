<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EPIC Analyst</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #9aa2b1;
    --accent: #6ea8fe;
    --accent-2: #3d5afe;
    --user-bubble: #2b3550;
    --bot-bubble: #1e222b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--text-dim); }

  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }

  .msg { display: flex; gap: 10px; max-width: 100%; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
    max-width: 75%;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.bot .bubble.error {
    border-color: #7a2b2b;
    color: #ffb4b4;
  }

  .meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .chart-wrap {
    margin-top: 10px;
    padding: 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-width: 520px;
  }
  .chart-title {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .chart-bar-label, .chart-bar-value, .chart-axis-label {
    font-size: 10.5px;
    fill: var(--text-dim);
  }

  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  form#composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px;
  }
  .composer-inner {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  textarea#question {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    max-height: 120px;
  }
  button#send {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button#send:disabled { opacity: 0.5; cursor: not-allowed; }

  .suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 820px;
    margin: 0 auto 10px auto;
  }
  .suggestions button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .suggestions button:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dot"></div>
    <div>
      <h1>EPIC Analyst</h1>
      <div class="sub">MVP &middot; conectado a Metabase</div>
    </div>
  </div>
  <select id="clientSelect"></select>
</header>

<div id="chat"></div>

<div class="suggestions" id="suggestions">
  <button data-q="¿Cuántos pedidos tuvimos ayer?">¿Cuántos pedidos tuvimos ayer?</button>
  <button data-q="¿Cuál tienda vendió más este mes?">¿Cuál tienda vendió más este mes?</button>
  <button data-q="¿Cuáles son los productos más vendidos este mes?">Productos más vendidos</button>
  <button data-q="¿Cuál es el ticket promedio del mes?">Ticket promedio del mes</button>
</div>

<form id="composer">
  <div class="composer-inner">
    <textarea id="question" rows="1" placeholder="Pregúntale algo a EPIC Analyst..."></textarea>
    <button id="send" type="submit">Enviar</button>
  </div>
</form>

<script>
  // Frontend y backend viven en el mismo Worker/dominio en producción,
  // así que las rutas son relativas. Si necesitas apuntar a otro backend
  // (por ejemplo en desarrollo local separado), define esta variable antes
  // de cargar este bloque, definiendo window.EPIC_ANALYST_API_BASE = '...' en un
  // script previo (evitar escribir aqui la etiqueta script literal: rompe el parser HTML)
  const API_BASE = window.EPIC_ANALYST_API_BASE || '';

  const chatEl = document.getElementById('chat');
  const form = document.getElementById('composer');
  const questionEl = document.getElementById('question');
  const sendBtn = document.getElementById('send');
  const clientSelect = document.getElementById('clientSelect');
  const suggestionsEl = document.getElementById('suggestions');

  function addMessage(role, text, { isError = false } = {}) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' error' : '');
    bubble.textContent = text;
    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.id = 'typing-indicator';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function addMeta(bubble, metrics) {
    if (!metrics) return;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `
      <span>⏱ ${metrics.latency_ms} ms</span>
      <span>🔤 ${metrics.input_tokens + metrics.output_tokens} tokens</span>
      <span>🛠 ${metrics.num_mcp_tool_calls} consultas a Metabase</span>
      <span>💵 $${metrics.estimated_cost_usd.toFixed(5)}</span>
    `;
    bubble.parentElement.appendChild(meta);
  }

  function renderBarChart(series, width, height) {
    const points = series[0]?.data || [];
    if (!points.length) return '';

    const padding = { top: 10, right: 10, bottom: 34, left: 10 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;
    const maxValue = Math.max(...points.map((p) => p.value), 1);
    const barGap = 10;
    const barW = (chartW - barGap * (points.length - 1)) / points.length;

    let bars = '';
    points.forEach((p, i) => {
      const barH = (p.value / maxValue) * chartH;
      const x = padding.left + i * (barW + barGap);
      const y = padding.top + (chartH - barH);
      bars += `
        <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" fill="#6ea8fe" />
        <text class="chart-bar-value" x="${x + barW / 2}" y="${y - 4}" text-anchor="middle">${p.value.toLocaleString('es-GT')}</text>
        <text class="chart-bar-label" x="${x + barW / 2}" y="${height - 12}" text-anchor="middle">${escapeXml(truncateLabel(p.label))}</text>
      `;
    });

    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${bars}</svg>`;
  }

  function renderLineChart(series, width, height) {
    const points = series[0]?.data || [];
    if (!points.length) return '';

    const padding = { top: 14, right: 14, bottom: 34, left: 14 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;
    const maxValue = Math.max(...points.map((p) => p.value), 1);
    const stepX = points.length > 1 ? chartW / (points.length - 1) : 0;

    const coords = points.map((p, i) => {
      const x = padding.left + i * stepX;
      const y = padding.top + (chartH - (p.value / maxValue) * chartH);
      return { x, y, p };
    });

    const path = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c.x} ${c.y}`).join(' ');
    const dots = coords
      .map(
        (c) => `<circle cx="${c.x}" cy="${c.y}" r="3" fill="#6ea8fe" />
        <text class="chart-bar-label" x="${c.x}" y="${height - 12}" text-anchor="middle">${escapeXml(truncateLabel(c.p.label))}</text>`
      )
      .join('');

    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
      <path d="${path}" fill="none" stroke="#6ea8fe" stroke-width="2" />
      ${dots}
    </svg>`;
  }

  function truncateLabel(label) {
    const s = String(label);
    return s.length > 12 ? s.slice(0, 11) + '…' : s;
  }

  function escapeXml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function addChart(bubble, chart) {
    if (!chart || !chart.series || !chart.series.length) return;

    const wrap = document.createElement('div');
    wrap.className = 'chart-wrap';

    const width = 480;
    const height = 220;
    const svg = chart.type === 'line' ? renderLineChart(chart.series, width, height) : renderBarChart(chart.series, width, height);

    wrap.innerHTML = (chart.title ? `<div class="chart-title">${escapeXml(chart.title)}</div>` : '') + svg;
    bubble.parentElement.appendChild(wrap);
  }

  async function loadClients() {
    try {
      const res = await fetch(`${API_BASE}/api/clients`);
      const clients = await res.json();
      clientSelect.innerHTML = clients
        .map((c) => `<option value="${c.client_id}">${c.display_name}</option>`)
        .join('');
    } catch (err) {
      clientSelect.innerHTML = '<option value="default">default</option>';
    }
  }

  async function sendQuestion(question) {
    if (!question.trim()) return;

    addMessage('user', question);
    questionEl.value = '';
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch(`${API_BASE}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question,
          client_id: clientSelect.value || 'dlp',
        }),
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        addMessage('bot', data.error || 'Ocurrió un error.', { isError: true });
        return;
      }

      const bubble = addMessage('bot', data.answer);
      addChart(bubble, data.chart);
      addMeta(bubble, data.metrics);
    } catch (err) {
      removeTyping();
      addMessage('bot', 'No se pudo contactar al backend. ¿Está corriendo en ' + API_BASE + '?', { isError: true });
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    sendQuestion(questionEl.value);
  });

  questionEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  suggestionsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-q]');
    if (btn) sendQuestion(btn.dataset.q);
  });

  loadClients();
</script>

</body>
</html>
