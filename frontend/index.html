<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EPIC Analyst</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #9aa2b1;
    --accent: #6ea8fe;
    --accent-2: #3d5afe;
    --user-bubble: #2b3550;
    --bot-bubble: #1e222b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--text-dim); }

  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }

  .msg { display: flex; flex-wrap: wrap; gap: 10px; max-width: 100%; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
    max-width: 75%;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.bot .bubble.error {
    border-color: #7a2b2b;
    color: #ffb4b4;
  }

  .meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .chart-wrap {
    position: relative;
    margin-top: 10px;
    padding: 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-width: 520px;
  }
  .chart-title {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
    padding-right: 30px;
  }
  .chart-bar-label, .chart-bar-value, .chart-axis-label {
    font-size: 10.5px;
    fill: var(--text-dim);
  }
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .chart-legend-item { display: flex; align-items: center; gap: 5px; }
  .chart-legend-dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0;
  }
  .chart-wrap-kpi { text-align: center; }
  .kpi-value {
    font-size: 34px;
    font-weight: 700;
    color: var(--text);
  }
  .kpi-delta {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .msg-actions {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    flex-basis: 100%;
  }
  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    padding: 0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .chart-download-btn {
    position: absolute;
    top: 8px;
    right: 8px;
  }

  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  form#composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px;
  }
  .composer-inner {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  textarea#question {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    max-height: 120px;
  }
  button#send {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button#send:disabled { opacity: 0.5; cursor: not-allowed; }

  .suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 820px;
    margin: 0 auto 10px auto;
  }
  .suggestions button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .suggestions button:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dot"></div>
    <div>
      <h1>EPIC Analyst</h1>
      <div class="sub">MVP &middot; conectado a Metabase</div>
    </div>
  </div>
  <select id="clientSelect"></select>
</header>

<div id="chat"></div>

<div class="suggestions" id="suggestions">
  <button data-q="¿Cuántos pedidos tuvimos ayer?">¿Cuántos pedidos tuvimos ayer?</button>
  <button data-q="¿Cuál tienda vendió más este mes?">¿Cuál tienda vendió más este mes?</button>
  <button data-q="¿Cuáles son los productos más vendidos este mes?">Productos más vendidos</button>
  <button data-q="¿Cuál es el ticket promedio del mes?">Ticket promedio del mes</button>
</div>

<form id="composer">
  <div class="composer-inner">
    <textarea id="question" rows="1" placeholder="Pregúntale algo a EPIC Analyst..."></textarea>
    <button id="send" type="submit">Enviar</button>
  </div>
</form>

<script>
  // Frontend y backend viven en el mismo Worker/dominio en producción,
  // así que las rutas son relativas. Si necesitas apuntar a otro backend
  // (por ejemplo en desarrollo local separado), define esta variable antes
  // de cargar este bloque, definiendo window.EPIC_ANALYST_API_BASE = '...' en un
  // script previo (evitar escribir aqui la etiqueta script literal: rompe el parser HTML)
  const API_BASE = window.EPIC_ANALYST_API_BASE || '';

  const chatEl = document.getElementById('chat');
  const form = document.getElementById('composer');
  const questionEl = document.getElementById('question');
  const sendBtn = document.getElementById('send');
  const clientSelect = document.getElementById('clientSelect');
  const suggestionsEl = document.getElementById('suggestions');

  function addMessage(role, text, { isError = false } = {}) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' error' : '');
    bubble.textContent = text;
    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.id = 'typing-indicator';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function addMeta(bubble, metrics) {
    if (!metrics) return;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `
      <span>⏱ ${metrics.latency_ms} ms</span>
      <span>🔤 ${metrics.input_tokens + metrics.output_tokens} tokens</span>
      <span>🛠 ${metrics.num_mcp_tool_calls} consultas a Metabase</span>
      <span>💵 $${metrics.estimated_cost_usd.toFixed(5)}</span>
    `;
    bubble.parentElement.appendChild(meta);
  }

  function renderBarChart(series, width, height) {
    const points = series[0]?.data || [];
    if (!points.length) return '';

    const padding = { top: 10, right: 10, bottom: 34, left: 10 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;
    const maxValue = Math.max(...points.map((p) => p.value), 1);
    const barGap = 10;
    const barW = (chartW - barGap * (points.length - 1)) / points.length;

    let bars = '';
    points.forEach((p, i) => {
      const barH = (p.value / maxValue) * chartH;
      const x = padding.left + i * (barW + barGap);
      const y = padding.top + (chartH - barH);
      bars += `
        <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" fill="#6ea8fe" />
        <text class="chart-bar-value" x="${x + barW / 2}" y="${y - 4}" text-anchor="middle">${p.value.toLocaleString('es-GT')}</text>
        <text class="chart-bar-label" x="${x + barW / 2}" y="${height - 12}" text-anchor="middle">${escapeXml(truncateLabel(p.label))}</text>
      `;
    });

    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${bars}</svg>`;
  }

  function renderLineChart(series, width, height) {
    const points = series[0]?.data || [];
    if (!points.length) return '';

    const padding = { top: 14, right: 14, bottom: 34, left: 14 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;
    const maxValue = Math.max(...points.map((p) => p.value), 1);
    const stepX = points.length > 1 ? chartW / (points.length - 1) : 0;

    const coords = points.map((p, i) => {
      const x = padding.left + i * stepX;
      const y = padding.top + (chartH - (p.value / maxValue) * chartH);
      return { x, y, p };
    });

    const path = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c.x} ${c.y}`).join(' ');
    const dots = coords
      .map(
        (c) => `<circle cx="${c.x}" cy="${c.y}" r="3" fill="#6ea8fe" />
        <text class="chart-bar-label" x="${c.x}" y="${height - 12}" text-anchor="middle">${escapeXml(truncateLabel(c.p.label))}</text>`
      )
      .join('');

    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
      <path d="${path}" fill="none" stroke="#6ea8fe" stroke-width="2" />
      ${dots}
    </svg>`;
  }

  const CHART_PALETTE = ['#6ea8fe', '#f78da7', '#ffd166', '#06d6a0', '#c77dff', '#ff9770'];

  function renderPieChart(series, width, height) {
    const points = series[0]?.data || [];
    if (!points.length) return '';

    const total = points.reduce((sum, p) => sum + p.value, 0) || 1;
    const cx = width / 2;
    const cy = height / 2;
    const r = Math.min(width, height) / 2 - 8;

    let angle = -Math.PI / 2;
    let slices = '';
    let legend = '';
    points.forEach((p, i) => {
      const frac = p.value / total;
      const sweep = frac * Math.PI * 2;
      const x1 = cx + r * Math.cos(angle);
      const y1 = cy + r * Math.sin(angle);
      angle += sweep;
      const x2 = cx + r * Math.cos(angle);
      const y2 = cy + r * Math.sin(angle);
      const largeArc = sweep > Math.PI ? 1 : 0;
      const color = CHART_PALETTE[i % CHART_PALETTE.length];
      slices += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z" fill="${color}" />`;
      legend += `<div class="chart-legend-item"><span class="chart-legend-dot" style="background:${color}"></span>${escapeXml(truncateLabel(p.label))} (${Math.round(frac * 100)}%)</div>`;
    });

    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${slices}</svg><div class="chart-legend">${legend}</div>`;
  }

  function renderStackedBarChart(chart, width, height) {
    const categories = chart.categories || [];
    const series = chart.series || [];
    if (!categories.length || !series.length) return '';

    const padding = { top: 10, right: 10, bottom: 34, left: 10 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;
    const totals = categories.map((_, i) => series.reduce((sum, s) => sum + (s.data[i] || 0), 0));
    const maxTotal = Math.max(...totals, 1);
    const barGap = 10;
    const barW = (chartW - barGap * (categories.length - 1)) / categories.length;

    let bars = '';
    categories.forEach((cat, i) => {
      const x = padding.left + i * (barW + barGap);
      let y = padding.top + chartH;
      series.forEach((s, si) => {
        const val = s.data[i] || 0;
        const barH = (val / maxTotal) * chartH;
        y -= barH;
        bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${CHART_PALETTE[si % CHART_PALETTE.length]}" />`;
      });
      bars += `<text class="chart-bar-label" x="${x + barW / 2}" y="${height - 12}" text-anchor="middle">${escapeXml(truncateLabel(cat))}</text>`;
    });

    const legend = series
      .map((s, si) => `<div class="chart-legend-item"><span class="chart-legend-dot" style="background:${CHART_PALETTE[si % CHART_PALETTE.length]}"></span>${escapeXml(s.name)}</div>`)
      .join('');

    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${bars}</svg><div class="chart-legend">${legend}</div>`;
  }

  function renderKpi(chart) {
    const valueStr = typeof chart.value === 'number'
      ? chart.value.toLocaleString('es-GT', { maximumFractionDigits: 2 })
      : escapeXml(String(chart.value));
    const unit = chart.unit ? `${escapeXml(chart.unit)} ` : '';
    const delta = chart.delta ? `<div class="kpi-delta">${escapeXml(chart.delta)}</div>` : '';
    return `<div class="kpi-value">${unit}${valueStr}</div>${delta}`;
  }

  function truncateLabel(label) {
    const s = String(label);
    return s.length > 12 ? s.slice(0, 11) + '…' : s;
  }

  function escapeXml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function addChart(bubble, chart) {
    if (!chart || !chart.type) return;

    const width = 480;
    const height = 220;
    let body = '';

    if (chart.type === 'kpi') {
      body = renderKpi(chart);
    } else if (chart.type === 'pie' && chart.series?.length) {
      body = renderPieChart(chart.series, width, height);
    } else if (chart.type === 'stacked-bar') {
      body = renderStackedBarChart(chart, width, height);
    } else if (chart.type === 'line' && chart.series?.length) {
      body = renderLineChart(chart.series, width, height);
    } else if (chart.series?.length) {
      body = renderBarChart(chart.series, width, height);
    }
    if (!body) return;

    const wrap = document.createElement('div');
    wrap.className = 'chart-wrap' + (chart.type === 'kpi' ? ' chart-wrap-kpi' : '');
    wrap.innerHTML = (chart.title ? `<div class="chart-title">${escapeXml(chart.title)}</div>` : '') + body + (chart.type !== 'kpi' ? ICON_DOWNLOAD_BTN : '');
    bubble.parentElement.appendChild(wrap);

    const downloadBtn = wrap.querySelector('[data-action="download"]');
    if (downloadBtn) {
      downloadBtn.addEventListener('click', () => downloadSvg(wrap.querySelector('svg')));
    }
  }

  const ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';
  const ICON_COPY = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const ICON_DOWNLOAD_BTN = `<button type="button" class="icon-btn chart-download-btn" data-action="download" title="Descargar gráfica">${ICON_DOWNLOAD}</button>`;

  function downloadSvg(svgEl) {
    if (!svgEl) return;
    const clone = svgEl.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    const svgString = new XMLSerializer().serializeToString(clone);
    const blob = new Blob([svgString], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `grafica-epic-analyst-${Date.now()}.svg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {}
    }
    // Fallback para navegadores/contextos donde la Clipboard API no esta
    // disponible o el permiso viene bloqueado.
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch {
      return false;
    }
  }

  function addActions(bubble, answerText) {
    const toolbar = document.createElement('div');
    toolbar.className = 'msg-actions';
    toolbar.innerHTML = `<button type="button" class="icon-btn" data-action="copy" title="Copiar respuesta">${ICON_COPY}</button>`;
    bubble.parentElement.appendChild(toolbar);

    const copyBtn = toolbar.querySelector('[data-action="copy"]');
    copyBtn.addEventListener('click', async () => {
      const ok = await copyText(answerText);
      copyBtn.innerHTML = ok ? ICON_CHECK : ICON_COPY;
      copyBtn.title = ok ? 'Copiado' : 'No se pudo copiar';
      setTimeout(() => {
        copyBtn.innerHTML = ICON_COPY;
        copyBtn.title = 'Copiar respuesta';
      }, 1500);
    });
  }

  async function loadClients() {
    try {
      const res = await fetch(`${API_BASE}/api/clients`);
      const clients = await res.json();
      clientSelect.innerHTML = clients
        .map((c) => `<option value="${c.client_id}">${c.display_name}</option>`)
        .join('');
    } catch (err) {
      clientSelect.innerHTML = '<option value="default">default</option>';
    }
  }

  async function sendQuestion(question) {
    if (!question.trim()) return;

    addMessage('user', question);
    questionEl.value = '';
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch(`${API_BASE}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question,
          client_id: clientSelect.value || 'dlp',
        }),
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        addMessage('bot', data.error || 'Ocurrió un error.', { isError: true });
        return;
      }

      const bubble = addMessage('bot', data.answer);
      addChart(bubble, data.chart);
      addActions(bubble, data.answer);
      addMeta(bubble, data.metrics);
    } catch (err) {
      removeTyping();
      addMessage('bot', 'No se pudo contactar al backend. ¿Está corriendo en ' + API_BASE + '?', { isError: true });
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    sendQuestion(questionEl.value);
  });

  questionEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  suggestionsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-q]');
    if (btn) sendQuestion(btn.dataset.q);
  });

  loadClients();
</script>

</body>
</html>
