<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EPIC Analyst — Panel de costos</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #9aa2b1;
    --accent: #6ea8fe;
    --accent-2: #3d5afe;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }

  select, button#refresh {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .kpi .label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .kpi .value { font-size: 24px; font-weight: 600; }
  .kpi .value.danger { color: var(--danger); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 14px; margin: 0 0 14px; font-weight: 600; color: var(--text-dim); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  .empty, .error {
    color: var(--text-dim);
    font-size: 13.5px;
    padding: 20px 0;
    text-align: center;
  }
  .error { color: var(--danger); }

  .chart-bar-label, .chart-bar-value {
    font-size: 10.5px;
    fill: var(--text-dim);
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Panel de costos — EPIC Analyst</h1>
      <div class="sub">Uso y costo estimado, ultimos <span id="daysLabel">30</span> dias</div>
    </div>
    <div style="display:flex; gap:8px;">
      <select id="daysSelect">
        <option value="7">Ultimos 7 dias</option>
        <option value="30" selected>Ultimos 30 dias</option>
        <option value="90">Ultimos 90 dias</option>
      </select>
      <button id="refresh">Actualizar</button>
    </div>
  </header>

  <div id="content">
    <div class="empty">Cargando...</div>
  </div>
</div>

<script>
  const API_BASE = window.EPIC_ANALYST_API_BASE || '';
  const contentEl = document.getElementById('content');
  const daysSelect = document.getElementById('daysSelect');
  const daysLabel = document.getElementById('daysLabel');
  const refreshBtn = document.getElementById('refresh');

  function fmtUsd(n) {
    return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  }
  function fmtNum(n) {
    return Number(n || 0).toLocaleString('en-US');
  }
  function escapeXml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderDailyChart(byDay, width, height) {
    if (!byDay || !byDay.length) return '<div class="empty">Sin datos en este rango.</div>';

    const padding = { top: 16, right: 10, bottom: 30, left: 10 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;
    const maxCost = Math.max(...byDay.map((d) => d.total_estimated_cost_usd), 0.01);
    const barGap = Math.max(2, 8 - byDay.length / 10);
    const barW = Math.max(2, (chartW - barGap * (byDay.length - 1)) / byDay.length);

    let bars = '';
    byDay.forEach((d, i) => {
      const cost = d.total_estimated_cost_usd || 0;
      const barH = (cost / maxCost) * chartH;
      const x = padding.left + i * (barW + barGap);
      const y = padding.top + (chartH - barH);
      const dateLabel = String(d.day).slice(5, 10);
      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(barH, 1)}" rx="2" fill="#6ea8fe">
        <title>${escapeXml(dateLabel)}: ${fmtUsd(cost)}</title>
      </rect>`;
      if (byDay.length <= 15 || i % Math.ceil(byDay.length / 15) === 0) {
        bars += `<text class="chart-bar-label" x="${x + barW / 2}" y="${height - 10}" text-anchor="middle">${escapeXml(dateLabel)}</text>`;
      }
    });

    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${bars}</svg>`;
  }

  function renderByClientTable(byClient) {
    if (!byClient || !byClient.length) return '<div class="empty">Sin datos en este rango.</div>';

    const rows = byClient
      .map(
        (c) => `<tr>
          <td>${escapeXml(c.client_id)}</td>
          <td class="num">${fmtNum(c.total_questions)}</td>
          <td class="num">${fmtUsd(c.total_estimated_cost_usd)}</td>
          <td class="num">${c.total_errors > 0 ? `<span style="color:var(--danger)">${fmtNum(c.total_errors)}</span>` : '0'}</td>
        </tr>`
      )
      .join('');

    return `<table>
      <thead><tr><th>Cliente</th><th class="num">Preguntas</th><th class="num">Costo</th><th class="num">Errores</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  async function loadDashboard() {
    const days = daysSelect.value;
    daysLabel.textContent = days;
    contentEl.innerHTML = '<div class="empty">Cargando...</div>';

    try {
      const res = await fetch(`${API_BASE}/api/dashboard?days=${days}`);
      const data = await res.json();

      if (data.error) {
        contentEl.innerHTML = `<div class="error">${escapeXml(data.error)}</div>`;
        return;
      }

      const t = data.totals || {};
      const avgCost = t.total_questions > 0 ? (t.total_estimated_cost_usd || 0) / t.total_questions : 0;
      const totalTokens = (t.total_input_tokens || 0) + (t.total_output_tokens || 0);

      contentEl.innerHTML = `
        <div class="kpis">
          <div class="kpi"><div class="label">Preguntas</div><div class="value">${fmtNum(t.total_questions)}</div></div>
          <div class="kpi"><div class="label">Costo total</div><div class="value">${fmtUsd(t.total_estimated_cost_usd)}</div></div>
          <div class="kpi"><div class="label">Costo promedio / pregunta</div><div class="value">${fmtUsd(avgCost)}</div></div>
          <div class="kpi"><div class="label">Latencia promedio</div><div class="value">${fmtNum(Math.round(t.avg_latency_ms || 0))} ms</div></div>
          <div class="kpi"><div class="label">Tokens totales</div><div class="value">${fmtNum(totalTokens)}</div></div>
          <div class="kpi"><div class="label">Errores</div><div class="value${t.total_errors > 0 ? ' danger' : ''}">${fmtNum(t.total_errors)}</div></div>
        </div>

        <div class="card">
          <h2>Costo por dia</h2>
          ${renderDailyChart(data.by_day, 900, 200)}
        </div>

        <div class="card">
          <h2>Por cliente</h2>
          ${renderByClientTable(data.by_client)}
        </div>
      `;
    } catch (err) {
      contentEl.innerHTML = `<div class="error">No se pudo cargar el panel: ${escapeXml(err.message)}</div>`;
    }
  }

  refreshBtn.addEventListener('click', loadDashboard);
  daysSelect.addEventListener('change', loadDashboard);
  loadDashboard();
</script>

</body>
</html>
